var STEPS=[{"nav": "Open the Group tab", "img": "i1", "text": "MTSS in Teacher Navigator is very simple, and approachable for either new users learning the system or returning, experienced users. In Teacher Nav there are four major tabs, which serve as different ways of grouping student data and identifying trends in the data. For interventions, we click on the Group tab. Like all tabs, we can search specific groups in the search bar or scrolling through each of the groups others have already created.", "alt": "Teacher Navigator home page showing grade levels. The Group tab in the left menu is open, with a search box and a list of existing groups."}, {"nav": "Add a new group", "img": "i2", "text": "When we want to create a new group in Teacher Navigator, we click the \"+ add group\" button and a new group setup will populate on the screen. For this example, we'll implement a Tier 2 intervention. We will name this group \"4th Grade Readers\". We can see in the screen that we can name our group whatever we'd like to, and we can either select from the entire district's group of students, or select from a specific school we know we want to add students from.", "alt": "New group setup screen. The group name field reads 4th Grade Readers, and a dropdown lets you choose the entire district or a specific school."}, {"nav": "Create the group", "img": "i3", "text": "When you click the \"Create Group\" button, you will be brought to a student selection menu where you can click and add students into the group. Because we did not select a school, the entire district's K-12 student population will be available for selection.", "alt": "Student selection screen for the new group, with Students and Staff tabs. The group is empty on the left, and all students in the district are listed with check boxes on the right."}, {"nav": "Search and sort students", "img": "i4", "text": "Due to the wide range of students we can select from, Teacher Navigator has added some filters that help us hone in the students we want to select. We can sort and search classroom or by student name….", "alt": "The all students list with a classroom search filter above the table and a search box open under the Name column."}, {"nav": "Filter by school name", "img": "i5", "text": "Filter by School Name….", "alt": "The all students list with the School(s) column filter open, showing a list of schools with check boxes."}, {"nav": "Filter by grade", "img": "i6", "text": "And select the grades of the students we want to select! Since we want to focus on 4th grade readers, we'll select the 4th grade filter.", "alt": "The all students list with the Grade(s) column filter open, showing grade check boxes."}, {"nav": "Add students to the group", "img": "i7", "text": "Now that we have selected 4th grade students, let's add 3 or 4 of our demo students into this group. To do so, we click the check mark by their name and click the \"add to group\" button.", "alt": "Several students checked in the all students list, with the add to group button showing how many students are selected."}, {"nav": "Select staff and save", "img": "i8", "text": "Once the students are selected, we will switch over to the 'staff' pane on the right of the student pane and select which staff will serve this group of students best. So in the same way we selected and filtered for students, we will filter for staff. Keep in mind, any staff member added to this group will be granted access to student-level information for all students in that group. Ensure you are giving the right staff access to the students that they need to see. Once you're done, click \"save name\" on the top right of the screen to save and create the group.", "alt": "The Staff pane for the new group. Selected staff are listed under Group, all staff are listed on the right, and the save name button is at the top right."}, {"nav": "Open your group", "img": "i9", "text": "Once that group is created, it will take approximately 24 hours before student data populates. When it does, you will see the same views (at a glance, assessments, well being or college and career readiness) as you do for any Class or Grade view. But you will also see the \"Updates\" tab, where the interventions and notes live in Teacher Nav. For this next part of the walkthrough, we'll be using a Group that we already made.", "alt": "A group page named Geometry Grade 5 on the at a glance tab. The tabs at a glance, updates, assessments and behavior are across the top, and six students are listed on the left."}, {"nav": "Add an intervention", "img": "i10", "text": "To create a new intervention, ensure that you are in the Updates tab, and you will see \"notes\" on the left side and \"interventions\" on the right side. Click \" + Add New\" and the intervention pop-up box will appear. From here, you can name the intervention, add a description, choose a content area, and select a start date and an end date for the intervention.", "alt": "The Updates tab of a group with notes on the left and interventions on the right. The new intervention form shows name, description, content area, start date and end date fields."}, {"nav": "Add more fields", "img": "i11", "text": "Click 'more fields' under the start and end date to add a Goal and intended outcome, why the students were selected, frequency, and quality and fidelity of the intervention", "alt": "The intervention form expanded with more fields: goal and intended outcome, why these students, frequency, and quality and fidelity, with cancel and save buttons at the bottom."}, {"nav": "Share updates in notes", "img": "i12", "text": "As the interventions progress, educators may want to update each other on how students are growing and learning. That communication is available in Teacher Nav via the \"notes\" section, where any staff member in the group can let others know what has changed and when.", "alt": "The Updates tab of a group with a note form open on the left, showing content and date fields with cancel and save buttons. No interventions have been created yet."}, {"nav": "Track progress and edit the group", "img": "i12", "alt": "The group screen with the assessments tab next to at a glance, updates and behavior, and the edit group button at the top right.", "text": "As your students continue to progress, test, and grow, you can see their total assessment history and any new assessments they've taken in the assessments tab of the Group, just like you can in Class or Grade views. You can also drill down on any student within the group by selecting their name. And if at any point you want to remove students or staff from a group, click the \"edit group\" button on the top right of the Group screen.", "closing": "This has been MTSS in Teacher Navigator! If you need any resources, assistance, or support, look through our Guide Library for documentation or please contact gps@ed.sc.gov for more information!"}];
var root=document.getElementById("mtss");
function $(id){return document.getElementById(id)}
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var cur=0,visited={0:true},n=STEPS.length;

var list=$("mtss-dots");
STEPS.forEach(function(s,i){
  var li=document.createElement("li"),b=document.createElement("button");
  b.type="button";b.className="mtss-dot";b.textContent=i+1;
  b.setAttribute("aria-label","Go to step "+(i+1)+": "+s.nav);
  b.addEventListener("click",function(){go(i)});
  li.appendChild(b);list.appendChild(li);
});
var dots=list.querySelectorAll(".mtss-dot");
var backs=root.querySelectorAll('[data-mtss="back"]'),nexts=root.querySelectorAll('[data-mtss="next"]');
Array.prototype.forEach.call(backs,function(b){b.addEventListener("click",function(){go(cur-1)})});
Array.prototype.forEach.call(nexts,function(b){b.addEventListener("click",function(){go(cur+1)})});

function render(){
  var s=STEPS[cur],d=DIM[s.img],img=$("mtss-img");
  $("mtss-count").textContent="Step "+(cur+1)+" of "+n;
  $("mtss-title").textContent=s.nav;
  $("mtss-text").textContent=s.text;
  img.width=d[0];img.height=d[1];img.style.maxWidth=d[0]+"px";
  img.src=IMG[s.img];img.alt=s.alt;
  $("mtss-end").hidden=!s.closing;
  if(s.closing)$("mtss-closing").textContent=s.closing;
  for(var i=0;i<dots.length;i++){
    var done=visited[i]&&i!==cur;
    dots[i].className="mtss-dot"+(i===cur?" is-current":"")+(done?" is-done":"");
    if(i===cur)dots[i].setAttribute("aria-current","step");else dots[i].removeAttribute("aria-current");
  }
  Array.prototype.forEach.call(backs,function(b){b.disabled=cur===0});
  Array.prototype.forEach.call(nexts,function(b){b.disabled=cur===n-1});
}
function go(i){
  cur=Math.max(0,Math.min(n-1,i));visited[cur]=true;render();
  $("mtss-title").focus({preventScroll:true});
  var c=$("mtss-count");
  if(c.getBoundingClientRect().top<0){c.scrollIntoView({block:"start",behavior:reduce?"auto":"smooth"})}
}
root.addEventListener("keydown",function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==="ArrowRight"&&cur<n-1){go(cur+1)}
  else if(e.key==="ArrowLeft"&&cur>0){go(cur-1)}
});
render();
})();
</script>
